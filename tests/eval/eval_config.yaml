metrics_to_run:
  - custom_response_quality
  - static_grounding_and_pii_check
  - agent_turn_count

custom_metrics:
  # Local LLM-as-judge (see response_quality.py). Runs via google-genai on Vertex AI or AI Studio.
  - name: custom_response_quality
    custom_function_file: response_quality.py
  # Deterministic static regression check (PII cleanliness, non-leakage, substantive length).
  - name: static_grounding_and_pii_check
    custom_function_file: static_regression_metrics.py
  - name: agent_turn_count
    custom_function: |
      def evaluate(instance):
          turns = (instance.get("agent_data") or {}).get("turns", [])
          return {'score': len(turns)}
