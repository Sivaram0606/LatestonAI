name: AgentOps Quality & Regression Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra lint

      - name: Lint with Ruff
        run: uv run ruff check app server.py tests/unit

      - name: Run Unit & 19-Point AgentOps Matrix Tests
        run: uv run pytest tests/unit -v

      - name: Validate Frontend TypeScript Build
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --prefix frontend && npm run build --prefix frontend
